<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TABIAN" />
<link rel="manifest" href="manifest.json" />
  <title>TABIAN · Finanzas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-name">TABIAN</div>
        <div class="brand-sub">CONSTRUCCIONES · FINANZAS</div>
      </div>
    </div>
  </header>

    <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="summary">
    <div class="summary-card ingresos">
      <div class="label">↑ Ingresos</div>
      <div class="amount" id="total-ingresos">0,00 €</div>
    </div>
    <div class="summary-card gastos">
      <div class="label">↓ Gastos</div>
      <div class="amount" id="total-gastos">0,00 €</div>
    </div>
    <div class="summary-card wide">
      <div class="label">Balance del mes</div>
      <div class="amount" id="balance">0,00 €</div>
    </div>
  </div>

 <div class="actions">
    <button class="btn btn-ingreso" onclick="openModal('ingreso')">+ INGRESO</button>
    <button class="btn btn-gasto" onclick="openModal('gasto')">+ GASTO</button>
  </div>

  <div class="transactions" id="tx-list"></div>

    <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">INGRESO</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Importe</label>
        <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div class="form-group">
        <label>Concepto</label>
        <input type="text" id="f-concept" placeholder="Ej: Obra Calle Mayor" />
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="f-date" />
      </div>
      <button class="btn-submit" id="btn-submit" onclick="saveTransaction()">GUARDAR</button>
    </div>
  </div>
  <script src="app.js"></script>

</body>
</html>
